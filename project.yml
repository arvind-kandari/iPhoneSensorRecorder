name: iPhoneSensorRecorder

options:
  bundleIdPrefix: com.arvindkandari

targets:
  iPhoneSensorRecorder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources

    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "This app uses the camera to record synchronized video."
        NSMicrophoneUsageDescription: "This app uses the microphone to record synchronized audio."
        NSMotionUsageDescription: "This app uses motion sensors to record synchronized sensor data."
        CFBundleDisplayName: SensorSync Recorder
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvindkandari.iPhoneSensorRecorder
        MARKETING_VERSION: "0.4"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"