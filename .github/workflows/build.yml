name: Build iPhone App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
      CERTIFICATE_PATH: ${{ runner.temp }}/distribution.p12
      PROFILE_TEMP_PATH: ${{ runner.temp }}/distribution.mobileprovision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_TEMP_PATH"

          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_TEMP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_TEMP_PATH" "$PROFILE_PATH"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Archive iOS app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project iPhoneSensorRecorder.xcodeproj \
            -scheme iPhoneSensorRecorder \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/CapturE.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=T5MV2V8L4J \
            PRODUCT_BUNDLE_IDENTIFIER=com.arvindkandari.iPhoneSensorRecorder \
            PROVISIONING_PROFILE_SPECIFIER="CapturE App Store Distribution" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive 2>&1 | tee build/archive.log

      - name: Create export options
        run: |
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>T5MV2V8L4J</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.arvindkandari.iPhoneSensorRecorder</key>
              <string>CapturE App Store Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export App Store Connect IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/CapturE.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            2>&1 | tee build/export.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CapturE-app-store-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload archive and export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-archive-export-logs
          path: |
            build/archive.log
            build/export.log
          if-no-files-found: warn

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${PROFILE_PATH:-}" ]; then
            rm -f "$PROFILE_PATH"
          fi
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f \
            "$CERTIFICATE_PATH" \
            "$PROFILE_TEMP_PATH" \
            "$RUNNER_TEMP/profile.plist"
